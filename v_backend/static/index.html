<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V Assistant</title>
    <link rel="stylesheet" href="/static/styles.css?v=3">
    <!-- 100% OFFLINE MARKDOWN PARSER -->
    <script src="/static/marked.min.js"></script>
</head>
<body>
    <!-- SECURITY GATE OVERLAY -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-modal">
            <h2 id="auth-title">V System Locked</h2>
            <p id="auth-subtitle">Checking system status...</p>
            <input type="password" id="pin-input" placeholder="Enter Master PIN" autocomplete="new-password">
            <button id="auth-btn">Unlock</button>
            <p id="auth-error" class="error-text"></p>
        </div>
    </div>

    <!-- MAIN APP CONTAINER (3-Column Grid) -->
    <div class="app-container" id="app-container" style="display: none;">
        
        <!-- Column 1: Left Pane (Nav Sidebar) -->
        <aside class="nav-sidebar">
            <div class="nav-header">
                <h2>Sessions</h2>
                <button id="new-chat-btn" title="New Chat">＋</button>
            </div>
            <div class="session-list" id="session-list">
                <!-- Chat histories will populate here -->
            </div>
            <div class="nav-footer" style="display: flex; justify-content: space-between;">
                <button id="settings-btn">⚙️ Config</button>
                <button id="exit-btn" style="color: #EF4444; background: none; border: none; font-weight: 600; cursor: pointer;">⏏ Exit V</button>
            </div>
        </aside>

        <!-- Column 2: Center Pane (Chat) -->
        <div class="chat-wrapper">
            <header class="chat-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button id="toggle-sidebar-btn" style="background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #6B7280;">☰</button>
                    <h2 id="current-chat-title" style="margin: 0; color: #111827;">V</h2>
                </div>
                <!-- Clean Green Status Dot -->
                <div class="status-indicator" id="global-status" title="System Online"></div>
            </header>
            
            <main class="chat-log" id="chat-log">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcome-screen">
                    <h1>Hello!</h1>
                    <p>What are we building today?</p>
                </div>
            </main>
            
            <footer class="input-area">
                <input type="text" id="user-input" placeholder="Message V..." autocomplete="off">
                <button id="send-btn">Send</button>
                <button id="stop-btn" style="display: none;">Stop</button>
            </footer>
        </div>

        <!-- Column 3: Right Pane (Task Sidebar) -->
        <aside class="task-sidebar">
            <header class="task-header">
                <h2>System Tasks</h2>
                <button id="refresh-tasks-btn" title="Sync with ROM">🔄</button>
            </header>
            
            <div class="task-input-area">
                <input type="text" id="new-task-input" placeholder="Quick add task..." autocomplete="off">
                <button id="add-task-btn">+</button>
            </div>

            <div class="task-list" id="task-list" style="display: flex; flex-direction: column; gap: 10px;">
                <div id="active-tasks-list"></div>
                <hr style="border: 0; border-top: 1px solid #E5E7EB; margin: 10px 0;">
                <h3 style="font-size: 0.85rem; color: #6B7280; padding: 0 15px;">Completed Tasks</h3>
                <div id="completed-tasks-list" style="opacity: 0.6;"></div>
            </div>
        </aside>

        <!-- Hidden Settings Modal -->
        <div id="settings-modal" style="display: none; position: absolute; bottom: 80px; left: 20px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 100; width: 250px; border: 1px solid #E5E7EB;">
            <h3 style="margin-bottom: 10px; font-size: 1rem;">Agent Config</h3>
            
            <label style="font-size: 0.8rem; color: #6B7280;">Personal Context & Instructions:</label>
            <textarea id="user-context-input" placeholder="e.g. I am an IT student. Keep answers brief and direct..." style="width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #D1D5DB; resize: vertical; height: 100px;"></textarea>
            
            <button onclick="saveSettings()" style="width: 100%; padding: 8px; background: #3B82F6; color: white; border: none; border-radius: 6px; cursor: pointer;">Save</button>
            <button onclick="document.getElementById('settings-modal').style.display='none'" style="width: 100%; padding: 8px; background: none; color: #6B7280; border: none; cursor: pointer; margin-top: 5px;">Close</button>
        </div>
    </div>

    <script src="/static/app.js?v=3"></script>
</body>
</html>
